<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Simulatore embed — come itch.io / YouTube Playables</title>
<style>
  body{margin:0;background:#1b1b25;font-family:system-ui,sans-serif;color:#fff;padding:12px}
  .bar{font-size:13px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar b{color:#7cb8ff}
  #frame-wrap{width:640px;max-width:100%;margin:0 auto}
  /* itch.io incapsula il gioco in un iframe: dimensioni tipiche 960x600 o custom */
  iframe{width:100%;height:480px;border:2px solid #3a3a55;border-radius:8px;background:#000;display:block}
</style>
</head>
<body>
  <div class="bar">
    <span>Simulatore embed:</span><b>iframe 640×480</b>
    <span id="status">in attesa di messaggi dal gioco…</span>
  </div>
  <div id="frame-wrap">
    <iframe id="game" src="index.html" title="Crucipuzzle"></iframe>
  </div>
  <script>
    window.addEventListener('message', e => {
      document.getElementById('status').textContent = 'messaggio: ' + JSON.stringify(e.data)
    })
  </script>
</body>
</html>
